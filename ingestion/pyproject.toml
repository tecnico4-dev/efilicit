[project]
name = "efilicit-ingestion"
version = "0.0.0"
description = "EfiLicit ETL / ingestion engine (Python 3.12)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.0",
  "lxml>=5.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "tenacity>=9.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
efilicit-ingestion = "efilicit_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efilicit_ingestion"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
