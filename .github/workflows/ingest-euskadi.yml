# Semana 3 + Semana 6 Paso 10 — ingesta Euskadi (KontratazioA REST) vía GitHub Actions.
# Disparo: workflow_dispatch (default dry-run). Sin on.schedule (ADR 020: cron externo).
# Live siempre auto_recent (primera página con fechas); override solo vía CLI.
name: Ingest Euskadi

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >
          dry-run = fixture in-memory (safe).
          fixture-db = fixture → Postgres (needs EFILICIT_DATABASE_URL).
          live = zona reciente API (auto; needs secrets; acotar max_pages; 10 items/página).
        type: choice
        options:
          - dry-run
          - fixture-db
          - live
        default: dry-run
      max_pages:
        description: >
          Páginas a descubrir desde la zona reciente (default 1; API = 10 items/página).
          Cron productivo típico: 50–100.
        required: false
        default: "1"
      upload_storage:
        description: "Subir RAW a Storage (requiere SUPABASE_SERVICE_ROLE_KEY + SUPABASE_URL)"
        type: boolean
        default: false

concurrency:
  group: ingest-euskadi-${{ github.event_name }}-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Run euskadi (${{ inputs.mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    env:
      EFILICIT_DATABASE_URL: ${{ secrets.EFILICIT_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODE: ${{ inputs.mode }}
      MAX_PAGES: ${{ inputs.max_pages || '1' }}
      UPLOAD_STORAGE: ${{ inputs.upload_storage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Guard secrets for write modes
        if: env.MODE != 'dry-run'
        run: |
          set -euo pipefail
          if [ -z "${EFILICIT_DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret EFILICIT_DATABASE_URL (required for ${MODE})"
            exit 1
          fi
          if [ "${UPLOAD_STORAGE}" = "true" ]; then
            if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_SERVICE_ROLE_KEY"
              exit 1
            fi
            if [ -z "${SUPABASE_URL:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_URL"
              exit 1
            fi
          fi

      - name: Run Euskadi CLI
        run: |
          set -euo pipefail
          EXTRA=(--max-pages "$MAX_PAGES")
          if [ "${UPLOAD_STORAGE}" != "true" ] && [ "$MODE" != "dry-run" ]; then
            EXTRA+=(--no-storage)
          fi

          case "$MODE" in
            dry-run)
              uv run python -m efilicit_ingestion.cli run-euskadi \
                --fixture tests/fixtures/euskadi/valid_page.json \
                --dry-run \
                --no-auto-recent \
                --start-page 1 \
                "${EXTRA[@]}"
              ;;
            fixture-db)
              uv run python -m efilicit_ingestion.cli run-euskadi \
                --fixture tests/fixtures/euskadi/valid_page.json \
                --no-auto-recent \
                --start-page 1 \
                "${EXTRA[@]}"
              ;;
            live)
              uv run python -m efilicit_ingestion.cli run-euskadi \
                --auto-recent \
                "${EXTRA[@]}"
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
