# Semana 2–4 + Semana 6 Paso 10 — ingesta PLACSP vía GitHub Actions.
# Manual: workflow_dispatch (default dry-run).
# Cron: lunes 05:00 UTC, live de las 3 sindicaciones (mes UTC actual).
# Artefacto = ZIP mensual Atom/CODICE; syndication: placsp | placsp_agregadas | placsp_menores.
name: Ingest PLACSP

on:
  workflow_dispatch:
    inputs:
      syndication:
        description: "Dataset PLACSP (643 perfiles / 1044 agregadas / 1143 menores)"
        type: choice
        options:
          - placsp
          - placsp_agregadas
          - placsp_menores
        default: placsp
      mode:
        description: >
          dry-run = fixture in-memory (safe).
          fixture-db = fixture → Postgres (needs EFILICIT_DATABASE_URL).
          live = ZIP real PLACSP (needs secrets + from_month; ZIPs pueden ser grandes).
        type: choice
        options:
          - dry-run
          - fixture-db
          - live
        default: dry-run
      from_month:
        description: "live: inicio YYYY-MM (obligatorio en live manual; cron = mes UTC actual)"
        required: false
        default: ""
      to_month:
        description: "live: fin YYYY-MM inclusivo (vacío = from_month)"
        required: false
        default: ""
      as_of:
        description: "Fecha pivote YYYY-MM-DD (discover / fixture window)"
        required: false
        default: ""
      run_id:
        description: "run_id opcional (fixture-db/live); vacío = UUID"
        required: false
        default: ""
      upload_storage:
        description: "Subir RAW a Storage (requiere SUPABASE_SERVICE_ROLE_KEY + SUPABASE_URL)"
        type: boolean
        default: false
  schedule:
    # Lunes 05:00 UTC
    - cron: "0 5 * * 1"

jobs:
  ingest:
    name: Run ${{ matrix.syndication }} (${{ github.event_name == 'schedule' && 'live' || inputs.mode }})
    runs-on: ubuntu-latest
    # concurrency aquí (no a nivel workflow): `matrix` solo existe en el job
    concurrency:
      group: ingest-placsp-${{ github.event_name }}-${{ matrix.syndication }}-${{ github.event.inputs.mode || 'live' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        syndication: ${{ github.event_name == 'schedule' && fromJSON('["placsp","placsp_agregadas","placsp_menores"]') || fromJSON(format('["{0}"]', github.event.inputs.syndication || 'placsp')) }}
    defaults:
      run:
        working-directory: ingestion
    env:
      EFILICIT_DATABASE_URL: ${{ secrets.EFILICIT_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
      # Cron: subir RAW si hay secrets (fallará el step de guard si faltan)
      UPLOAD_STORAGE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_storage }}
      FROM_MONTH: ${{ github.event.inputs.from_month || '' }}
      TO_MONTH: ${{ github.event.inputs.to_month || '' }}
      AS_OF: ${{ github.event.inputs.as_of || '' }}
      RUN_ID: ${{ github.event.inputs.run_id || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Guard secrets for write modes
        if: env.MODE != 'dry-run'
        run: |
          set -euo pipefail
          if [ -z "${EFILICIT_DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret EFILICIT_DATABASE_URL (required for ${MODE})"
            exit 1
          fi
          if [ "${UPLOAD_STORAGE}" = "true" ]; then
            if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_SERVICE_ROLE_KEY"
              exit 1
            fi
            if [ -z "${SUPABASE_URL:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_URL"
              exit 1
            fi
          fi

      - name: Run PLACSP CLI
        run: |
          set -euo pipefail
          SYNDICATION="${{ matrix.syndication }}"
          EXTRA=(--syndication "$SYNDICATION")
          if [ -n "${AS_OF:-}" ]; then
            EXTRA+=(--as-of "$AS_OF")
          fi
          if [ -n "${RUN_ID:-}" ]; then
            EXTRA+=(--run-id "$RUN_ID")
          fi
          if [ "${UPLOAD_STORAGE}" != "true" ] && [ "$MODE" != "dry-run" ]; then
            EXTRA+=(--no-storage)
          fi

          case "$MODE" in
            dry-run)
              uv run python -m efilicit_ingestion.cli run-placsp \
                --fixture tests/fixtures/placsp/valid_single_entry.atom \
                --dry-run \
                "${EXTRA[@]}"
              ;;
            fixture-db)
              uv run python -m efilicit_ingestion.cli run-placsp \
                --fixture tests/fixtures/placsp/valid_single_entry.atom \
                "${EXTRA[@]}"
              ;;
            live)
              FROM="${FROM_MONTH:-}"
              TO="${TO_MONTH:-}"
              if [ -z "$FROM" ]; then
                FROM="$(date -u +%Y-%m)"
              fi
              if [ -z "$TO" ]; then
                TO="$FROM"
              fi
              echo "live window: ${FROM} .. ${TO}"
              uv run python -m efilicit_ingestion.cli run-placsp \
                --from-month "$FROM" \
                --to-month "$TO" \
                "${EXTRA[@]}"
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
