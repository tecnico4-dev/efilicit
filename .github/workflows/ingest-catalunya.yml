# Semana 3 + Semana 6 Paso 10 — ingesta Catalunya (Socrata) vía GitHub Actions.
# Manual: workflow_dispatch (default dry-run).
# Cron: lunes 06:00 UTC, live (max_pages=10).
name: Ingest Catalunya

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >
          dry-run = fixture in-memory (safe).
          fixture-db = fixture → Postgres (needs EFILICIT_DATABASE_URL).
          live = página(s) SODA reales (needs secrets; acotar max_pages).
        type: choice
        options:
          - dry-run
          - fixture-db
          - live
        default: dry-run
      page_size:
        description: "SODA $limit por página (default 1000)"
        required: false
        default: "1000"
      max_pages:
        description: "Páginas a descubrir (default 1; en live mantener bajo)"
        required: false
        default: "1"
      start_offset:
        description: "SODA $offset inicial (default 0)"
        required: false
        default: "0"
      run_id:
        description: "run_id opcional (fixture-db/live); vacío = UUID"
        required: false
        default: ""
      upload_storage:
        description: "Subir RAW a Storage (requiere SUPABASE_SERVICE_ROLE_KEY + SUPABASE_URL)"
        type: boolean
        default: false
  schedule:
    # Lunes 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ingest-catalunya-${{ github.event_name }}-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Run catalunya (${{ github.event_name == 'schedule' && 'live' || inputs.mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    env:
      EFILICIT_DATABASE_URL: ${{ secrets.EFILICIT_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
      PAGE_SIZE: ${{ github.event_name == 'schedule' && '1000' || inputs.page_size || '1000' }}
      MAX_PAGES: ${{ github.event_name == 'schedule' && '10' || inputs.max_pages || '1' }}
      START_OFFSET: ${{ github.event_name == 'schedule' && '0' || inputs.start_offset || '0' }}
      RUN_ID: ${{ github.event.inputs.run_id || '' }}
      UPLOAD_STORAGE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_storage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Guard secrets for write modes
        if: env.MODE != 'dry-run'
        run: |
          set -euo pipefail
          if [ -z "${EFILICIT_DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret EFILICIT_DATABASE_URL (required for ${MODE})"
            exit 1
          fi
          if [ "${UPLOAD_STORAGE}" = "true" ]; then
            if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_SERVICE_ROLE_KEY"
              exit 1
            fi
            if [ -z "${SUPABASE_URL:-}" ]; then
              echo "::error::upload_storage=true requires secret SUPABASE_URL"
              exit 1
            fi
          fi

      - name: Run Catalunya CLI
        run: |
          set -euo pipefail
          EXTRA=(--page-size "$PAGE_SIZE" --max-pages "$MAX_PAGES" --start-offset "$START_OFFSET")
          if [ -n "${RUN_ID:-}" ]; then
            EXTRA+=(--run-id "$RUN_ID")
          fi
          if [ "${UPLOAD_STORAGE}" != "true" ] && [ "$MODE" != "dry-run" ]; then
            EXTRA+=(--no-storage)
          fi

          case "$MODE" in
            dry-run)
              uv run python -m efilicit_ingestion.cli run-catalunya \
                --fixture tests/fixtures/catalunya/valid_page.json \
                --dry-run \
                "${EXTRA[@]}"
              ;;
            fixture-db)
              uv run python -m efilicit_ingestion.cli run-catalunya \
                --fixture tests/fixtures/catalunya/valid_page.json \
                "${EXTRA[@]}"
              ;;
            live)
              uv run python -m efilicit_ingestion.cli run-catalunya \
                "${EXTRA[@]}"
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
