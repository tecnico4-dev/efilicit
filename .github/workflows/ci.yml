# CI mínimo del monorepo (Fase 0+ / Semana 1).
# Sin secretos: no despliega ni escribe en remoto.
# Node 24 / pnpm 10.33.0 fijados en package.json del repo.
# Ingestion: pytest siempre en verde; tests que necesitan Postgres local
# se saltan si no hay DB (ADR 004) — no montamos Supabase en Actions aún.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @efilicit/web lint

      - name: Typecheck packages
        run: pnpm -r run typecheck

      - name: Build web
        run: pnpm --filter @efilicit/web build

  ingestion:
    name: Ingestion CLI + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: CLI help
        run: uv run python -m efilicit_ingestion.cli --help

      - name: Pytest
        run: uv run pytest -q
