# ADR 020 — drenado diario de digests (sin match).
#
# Flujo: notification_queue pending → un email por usuario/periodo (Resend).
# Disparo: workflow_dispatch (default dry-run). Sin on.schedule (cron externo).
# Frecuencias diaria|semanal; instant fuera del MVP (ADR 013).
# Envío desde el job Python, no Edge Function (ADR 012).
name: Alerts digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >
          dry-run = fixtures en memoria + Fake (seguro; phase send sobre cola vacía de dry-run match).
          write-fake = drena cola Postgres con FakeEmailSender (necesita EFILICIT_DATABASE_URL).
          write-resend = drena cola + Resend real (DB + RESEND_API_KEY + ALERT_FROM_EMAIL).
        type: choice
        options:
          - dry-run
          - write-fake
          - write-resend
        default: dry-run
      digest:
        description: "Día de digest YYYY-MM-DD (vacío = hoy UTC)"
        required: false
        default: ""

concurrency:
  group: alerts-digest-${{ github.event_name }}-${{ github.event.inputs.mode || 'write-resend' }}
  cancel-in-progress: false

jobs:
  alerts:
    name: Run alerts send (${{ github.event_name == 'schedule' && 'write-resend' || inputs.mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    env:
      EFILICIT_DATABASE_URL: ${{ secrets.EFILICIT_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      MODE: ${{ github.event_name == 'schedule' && 'write-resend' || inputs.mode }}
      DIGEST: ${{ github.event_name == 'schedule' && '' || inputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Guard secrets for write modes
        if: env.MODE != 'dry-run'
        run: |
          set -euo pipefail
          if [ -z "${EFILICIT_DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret EFILICIT_DATABASE_URL (required for ${MODE})"
            exit 1
          fi
          if [ "${MODE}" = "write-resend" ]; then
            if [ -z "${RESEND_API_KEY:-}" ]; then
              echo "::error::write-resend requires secret RESEND_API_KEY"
              exit 1
            fi
            if [ -z "${ALERT_FROM_EMAIL:-}" ]; then
              echo "::error::write-resend requires secret ALERT_FROM_EMAIL"
              exit 1
            fi
          fi

      - name: Run alerts send CLI
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${DIGEST:-}" ]; then
            EXTRA+=(--digest "$DIGEST")
          fi

          case "$MODE" in
            dry-run)
              # Smoke: phase all en memoria (match+drain fixtures); cron real usa write-resend+send.
              uv run python -m efilicit_ingestion.cli run-alerts \
                --dry-run \
                --phase all \
                "${EXTRA[@]}"
              ;;
            write-fake)
              uv run python -m efilicit_ingestion.cli run-alerts \
                --write \
                --phase send \
                "${EXTRA[@]}"
              ;;
            write-resend)
              uv run python -m efilicit_ingestion.cli run-alerts \
                --write \
                --phase send \
                --send \
                "${EXTRA[@]}"
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
